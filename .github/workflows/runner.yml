name: runner

on:
  workflow_dispatch:

concurrency:
  group: runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install browser
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx patchright install --with-deps chromium

      - name: Test
        run: npm test

      - name: Python deps (vision)
        run: |
          python3 -m pip --version >/dev/null 2>&1 || sudo apt-get install -y -qq python3-pip >/dev/null
          sudo python3 -m pip install --break-system-packages --no-cache-dir -q numpy opencv-python-headless
          python3 -m pip install --break-system-packages -q torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --break-system-packages -q --force-reinstall --no-deps torchvision --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --break-system-packages -q timm open_clip_torch
          python3 -c "import cv2, numpy, torch, timm, open_clip; print('cv2', cv2.__version__, 'torch', torch.__version__)"
          sudo mkdir -p /tmp/modelcache && sudo chmod 777 /tmp/modelcache
          echo "HF_HOME=/tmp/modelcache" >> "$GITHUB_ENV"
          HF_HOME=/tmp/modelcache python3 -c "import timm, open_clip; timm.create_model('vit_small_patch14_dinov2.lvd142m', pretrained=True, num_classes=0, img_size=518); open_clip.create_model_and_transforms('ViT-B-32', pretrained='openai'); print('models cached')"

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --ssh=false --hostname=trixvler

      - name: SSH server (password, port 22)
        run: |
          PW=$(openssl rand -hex 8)
          echo "PW=$PW" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server >/dev/null
          id -u trix >/dev/null 2>&1 || sudo useradd -m -s /bin/bash trix
          echo "trix:$PW" | sudo chpasswd
          echo "trix ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/trix >/dev/null
          sudo chmod 440 /etc/sudoers.d/trix
          sudo mkdir -p /etc/ssh/sshd_config.d /run/sshd
          printf '%s\n' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication no' 'PermitRootLogin no' 'Port 22' | sudo tee /etc/ssh/sshd_config.d/99-trix.conf >/dev/null
          grep -q '^Include /etc/ssh/sshd_config.d' /etc/ssh/sshd_config || echo 'Include /etc/ssh/sshd_config.d/*.conf' | sudo tee -a /etc/ssh/sshd_config >/dev/null
          sudo sed -i -E 's/^#?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i -E 's/^#?KbdInteractiveAuthentication.*/KbdInteractiveAuthentication no/' /etc/ssh/sshd_config
          sudo /usr/sbin/sshd -t
          sudo systemctl restart ssh 2>/dev/null || sudo service ssh restart 2>/dev/null || sudo /usr/sbin/sshd
          sudo /usr/sbin/sshd -T 2>/dev/null | grep -i passwordauth || true

      - name: Credential
        run: |
          IP4=$(tailscale ip -4 | head -1)
          BODY=$(printf 'IP: %s\nUSERNAME: trix\nPASSWORD: %s' "$IP4" "$PW")
          printf '%s\n' "$BODY" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS -m 10 -d "$BODY" https://ntfy.sh/trixvler-ssh-9f2c7b7a >/dev/null 2>&1 || true

      - name: Install cloudflared
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Serve + tunnel + keepalive
        env:
          TRIXVLER_KEY: ${{ secrets.TRIXVLER_KEY }}
          APINEX_KEY: ${{ secrets.APINEX_KEY }}
          APINEX_MODEL: ${{ vars.APINEX_MODEL }}
          AGENTROUTER_KEY: ${{ secrets.AGENTROUTER_KEY }}
          AGENTROUTER_MODEL: ${{ vars.AGENTROUTER_MODEL }}
          AGENTROUTER_PROXY: ${{ vars.AGENTROUTER_PROXY }}
          NUMES_KEY: ${{ secrets.NUMES_KEY }}
          NUMES_MODEL: ${{ vars.NUMES_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -u
          set +e
          xvfb-run -a node server.mjs > server.log 2>&1 &
          SRV=$!
          for h in $(seq 1 25); do
            sleep 1
            curl -sf localhost:8080/health >/dev/null && break
          done
          curl -s localhost:8080/health; echo
          tail -5 server.log || true

          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" > cfn.log 2>&1 &
            CFN=$!
          fi

          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > cf.log 2>&1 &
          CF=$!
          trap 'kill $SRV $CF ${CFN:-} 2>/dev/null || true' EXIT

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          echo "quick: ${URL:-none}"
          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            echo "named: aktif (hostname dari dashboard CF)"
          fi
          {
            echo "## trixvler up"
            echo ""
            echo "- SSH: \`ssh ubuntu@trixvler\`"
            echo "- Tailnet API: \`http://trixvler:8080/solve\`"
            if [ -n "$URL" ]; then echo "- Public API: \`$URL/solve\`"; fi
            if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then echo "- Named: hostname yang lu set di dashboard CF"; fi
            echo "- Auth: \`Authorization: Bearer <TRIXVLER_KEY>\`"
          } >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 340); do
            sleep 60
            if [ "$i" -eq 335 ] && [ -n "${GH_PAT:-}" ]; then
              echo "self-redispatch at minute $i"
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner.yml/dispatches" \
                -d '{"ref":"main"}' && echo "dispatch ok" || echo "dispatch failed"
            fi
            if [ $((i % 30)) -eq 0 ]; then
              tailscale status | head -3 || true
              if curl -sf localhost:8080/health >/dev/null; then
                echo "health ok"
              else
                echo "health FAIL -> restart server"
                kill "$SRV" 2>/dev/null || true
                xvfb-run -a node server.mjs >> server.log 2>&1 &
                SRV=$!
                sleep 2
                curl -s localhost:8080/health || true
                echo
              fi
              tail -2 cf.log || true
              [ -n "${CFN:-}" ] && tail -2 cfn.log || true
            fi
          done
