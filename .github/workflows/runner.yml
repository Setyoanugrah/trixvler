name: runner

on:
  workflow_dispatch:

concurrency:
  group: runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --ssh --hostname=trixvler

      - name: Install cloudflared
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Serve + tunnel + keepalive
        env:
          TRIXVLER_KEY: ${{ secrets.TRIXVLER_KEY }}
          APINEX_KEY: ${{ secrets.APINEX_KEY }}
          APINEX_MODEL: ${{ vars.APINEX_MODEL }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -u
          node server.mjs > server.log 2>&1 &
          SRV=$!
          sleep 2
          curl -s localhost:8080/health; echo

          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" > cfn.log 2>&1 &
            CFN=$!
          fi

          cloudflared tunnel --url http://localhost:8080 --no-autoupdate > cf.log 2>&1 &
          CF=$!
          trap 'kill $SRV $CF ${CFN:-} 2>/dev/null || true' EXIT

          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          echo "quick: ${URL:-none}"
          if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then
            echo "named: aktif (hostname dari dashboard CF)"
          fi
          {
            echo "## trixvler up"
            echo ""
            echo "- SSH: \`ssh ubuntu@trixvler\`"
            echo "- Tailnet API: \`http://trixvler:8080/solve\`"
            if [ -n "$URL" ]; then echo "- Public API: \`$URL/solve\`"; fi
            if [ -n "${CF_TUNNEL_TOKEN:-}" ]; then echo "- Named: hostname yang lu set di dashboard CF"; fi
            echo "- Auth: \`Authorization: Bearer <TRIXVLER_KEY>\`"
          } >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 350); do
            sleep 60
            if [ "$i" -eq 345 ] && [ -n "${GH_PAT:-}" ]; then
              echo "self-redispatch at minute $i"
              curl -fsS -X POST \
                -H "Authorization: Bearer $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/runner.yml/dispatches" \
                -d '{"ref":"main"}' && echo "dispatch ok" || echo "dispatch failed"
            fi
            if [ $((i % 30)) -eq 0 ]; then
              tailscale status | head -3 || true
              if curl -sf localhost:8080/health >/dev/null; then
                echo "health ok"
              else
                echo "health FAIL -> restart server"
                kill "$SRV" 2>/dev/null || true
                node server.mjs >> server.log 2>&1 &
                SRV=$!
                sleep 2
                curl -s localhost:8080/health || true
                echo
              fi
              tail -2 cf.log || true
              [ -n "${CFN:-}" ] && tail -2 cfn.log || true
            fi
          done
